name: Release

on:
  push:
    tags:
      - sourcemod/v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCEMOD_VERSION: "1.12"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      basename: ${{ steps.release.outputs.basename }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release ref
        id: inputs
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "release_tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag is required." >&2
            exit 1
          fi

      - name: Resolve release tag
        id: release
        run: bash ./scripts/ci-resolve-release.sh "${{ steps.inputs.outputs.release_tag }}"

      - name: Ensure tag points to main history
        shell: bash
        run: |
          git fetch origin main --depth=1
          git fetch origin "refs/tags/${{ steps.inputs.outputs.release_tag }}:refs/tags/${{ steps.inputs.outputs.release_tag }}"
          target_commit="$(git rev-list -n 1 "${{ steps.inputs.outputs.release_tag }}")"
          if ! git merge-base --is-ancestor "$target_commit" "origin/main"; then
            echo "Tag ${{ steps.inputs.outputs.release_tag }} does not point to a commit on main." >&2
            exit 1
          fi

  deps-smx:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-sourcemod.py', 'scripts/build-local.py', 'scripts/stage-artifact.py', 'scripts/package-release.py', 'plugin-package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: deps
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch SourceMod dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: deps
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - deps-smx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: deps
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX
        run: make build-smx PYTHON=python3 SPCOMP="deps/sourcemod-linux/addons/sourcemod/scripting/spcomp"

      - name: Upload SMX build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Upload compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: deps/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-smx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/smx

      - name: Download compile log
        uses: actions/download-artifact@v8
        with:
          name: smx-compile-log
          path: deps

      - name: Package SMX tree
        run: make package-smx PYTHON=python3

      - name: Stage artifact
        run: |
          python3 ./scripts/stage-artifact.py . ./.build/package-smx ./deps/build-smx-compile.log
          bash ./scripts/ci-validate-artifact.sh

      - name: Package zip
        run: make release PYTHON=python3 RELEASE_BASENAME="${{ needs.prepare-release.outputs.basename }}"

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.prepare-release.outputs.basename }}
          path: dist/release/${{ needs.prepare-release.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          files: dist/release/${{ needs.prepare-release.outputs.basename }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
